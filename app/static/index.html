<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Автопілот</title>
<style>
:root{--bg:#f3f6f4;--ink:#14231c;--mut:#5d7066;--line:#d5dfd9;--card:#fff;--acc:#0f7a5a;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a15;--ink:#e6efe9;--mut:#8da197;--line:#25382f;--card:#16251e;--acc:#3ccf9f;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink)}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0}
nav button{font:inherit;border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:var(--bg);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}h2{margin:.2em 0 .8em;font-size:1.5rem}
.letter{font-size:6rem;line-height:1;color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card small{color:var(--mut);display:block}.card b{font-size:1.2rem}
input,select,button.b{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button.b{background:var(--acc);color:#fff;border:0;cursor:pointer}button.b.red{background:var(--bad)}
label{display:flex;gap:10px;align-items:center;margin:12px 0}table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}.err{color:var(--bad)}
textarea{width:100%;height:120px;font:13px monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);let tab='home';
const api=async(u,m='GET',b)=>{const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(r.status==401&&u!='login'){return login()} if(!r.ok){alert((await r.json()).detail||'Помилка');throw 0} return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function login(){$('#app').innerHTML=`<main><h2>Вхід</h2><div class=row><input id=pw type=password placeholder="Пароль" autofocus><button class=b id=go>Увійти</button></div></main>`;
 const go=async()=>{await api('login','POST',{password:$('#pw').value});shell()};$('#go').onclick=go;$('#pw').onkeydown=e=>e.key=='Enter'&&go()}
function shell(){const t={home:'Головна',contacts:'Контакти',auto:'Автоматизація',hist:'Історія',set:'Налаштування'};
 $('#app').innerHTML=`<nav>${Object.entries(t).map(([k,v])=>`<button data-t=${k} class="${k==tab?'on':''}">${v}</button>`).join('')}</nav><main id=m></main>`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});({home,contacts,auto,hist,set})[tab]()}
async function home(){const s=await api('status');const A={ok:'Підключено',expired:'Сесія недійсна',pending:'Очікує перевірки',none:'Не підключено'};
 $('#m').innerHTML=`<h2>Головна</h2><div class=row style="align-items:center;gap:24px"><div><small>Наступна літера</small><div class=letter>${s.next_letter}</div></div>
 <button class="b ${s.running?'red':''}" id=t>${s.running?'Зупинити':'Запустити'}</button></div><div class=grid>
 <div class=card><small>Сервер (worker)</small><b>${s.worker_online?'онлайн':'не відповідає'}</b></div>
 <div class=card><small>Автоматизація</small><b>${s.running?'працює':'вимкнена'}</b></div>
 <div class=card><small>Останнє виконання</small><b>${esc(s.last_run?new Date(s.last_run).toLocaleString('uk-UA'):'—')}</b></div>
 <div class=card><small>Контактів</small><b>${s.contacts}</b></div><div class=card><small>Надіслано літер</small><b>${s.sent}</b></div>
 <div class=card><small>Акаунт</small><b>${A[s.auth]}</b></div></div>`;
 $('#t').onclick=async()=>{await api('running','POST',{on:!s.running});home()}}
async function contacts(q=''){const c=await api('contacts?q='+encodeURIComponent(q));
 $('#m').innerHTML=`<h2>Контакти</h2><input id=q placeholder="Пошук" value="${esc(q)}"><table><tr><th>Ім'я<th>Вогник<th>Авто</tr>
 ${c.map((x,i)=>`<tr><td>${esc(x.name)}<td>${x.streak?'🔥 активний':'—'}<td><input type=checkbox data-i=${i} ${x.enabled?'checked':''}></tr>`).join('')||'<tr><td colspan=3>Контактів немає. Запустіть автоматизацію — список збереться з TikTok.'}</table>`;
 $('#q').onchange=e=>contacts(e.target.value);document.querySelectorAll('[data-i]').forEach(b=>b.onchange=()=>api('contacts/toggle','POST',{name:c[b.dataset.i].name,enabled:b.checked}))}
async function auto(){const s=await api('settings');
 $('#m').innerHTML=`<h2>Автоматизація</h2><label><input type=checkbox id=daily ${s.daily_on=='1'?'checked':''}>Щоденне надсилання літер</label>
 <label><input type=checkbox id=video ${s.video_on=='1'?'checked':''}>Відповідати на відео</label>
 <label>Смайлик <input id=emoji value="${esc(s.emoji)}" size=4></label><label>Час надсилання <input id=time type=time value="${s.send_time}"></label>
 <label>Часовий пояс <input id=tz value="${esc(s.tz)}"></label><button class=b id=save>Зберегти</button>`;
 $('#save').onclick=async()=>{await api('settings','PUT',{daily_on:$('#daily').checked?'1':'0',video_on:$('#video').checked?'1':'0',emoji:$('#emoji').value,send_time:$('#time').value,tz:$('#tz').value});alert('Збережено')}}
async function hist(k='letter'){const h=await api('history?kind='+k);
 $('#m').innerHTML=`<h2>Історія</h2><div class=row><select id=k><option value=letter ${k=='letter'?'selected':''}>Автоповідомлення</option><option value=video ${k=='video'?'selected':''}>Відео та відповіді</option></select></div>
 <div style="overflow-x:auto"><table><tr><th>Час<th>Контакт<th>Дія<th>Статус</tr>${h.map(x=>`<tr><td>${x.ts}<td>${esc(x.contact)}<td>${esc(x.kind)}: ${esc(x.detail)}<td class="${x.status=='ok'?'':'err'}">${esc(x.status)}</tr>`).join('')}</table></div>`;
 $('#k').onchange=e=>hist(e.target.value)}
async function set(){const s=await api('status');
 $('#m').innerHTML=`<h2>Налаштування</h2><p>Статус: <b>${s.auth}</b></p><p>Вставте JSON cookies tiktok.com (див. README, розділ 4):</p><textarea id=ck></textarea>
 <div class=row><button class=b id=sv>Підключити акаунт</button><button class="b red" id=del>Відключити акаунт</button><button class=b id=out>Вийти з панелі</button></div>`;
 $('#sv').onclick=async()=>{await api('cookies','POST',{cookies:$('#ck').value});alert('Збережено (зашифровано)');set()};
 $('#del').onclick=async()=>{await api('cookies','DELETE');set()};$('#out').onclick=async()=>{await api('logout','POST');login()}}
api('me').then(r=>r.ok?shell():login());
</script></body></html>

<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Автопілот</title>
<style>
:root{--bg:#f3f6f4;--ink:#14231c;--mut:#5d7066;--line:#d5dfd9;--card:#fff;--acc:#0f7a5a;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a15;--ink:#e6efe9;--mut:#8da197;--line:#25382f;--card:#16251e;--acc:#3ccf9f;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink)}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0}
nav button{font:inherit;border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:var(--bg);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}h2{margin:.2em 0 .8em;font-size:1.5rem}
.letter{font-size:6rem;line-height:1;color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card small{color:var(--mut);display:block}.card b{font-size:1.2rem}
input,select,button.b{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button.b{background:var(--acc);color:#fff;border:0;cursor:pointer}button.b.red{background:var(--bad)}
label{display:flex;gap:10px;align-items:center;margin:12px 0}table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}.err{color:var(--bad)}
textarea{width:100%;height:120px;font:13px monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.av{display:inline-block;width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;background:var(--line)}.nick{color:var(--ink);text-decoration:none}.nick:hover{color:var(--acc);text-decoration:underline}.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;background:var(--bg)}</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);let tab='home',timer;
const api=async(u,m='GET',b)=>{const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(r.status==401&&u!='login'){return login()} if(!r.ok){alert((await r.json()).detail||'Помилка');throw 0} return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={info:'Інфо',letter:'Літера',video_in:'Отримано відео',video_reply:'Відповідь на відео',worker:'Помилка роботи'};
const rows=h=>h.map(x=>`<tr><td>${x.ts}<td>${esc(x.contact)}<td>${KIND[x.kind]||x.kind}: ${esc(x.detail)}<td class="${x.status=='ok'?'':'err'}">${esc(x.status)}</tr>`).join('')||'<tr><td colspan=4>Подій ще немає</tr>';
const prof=p=>p?`<div style="display:flex;gap:8px;align-items:center;margin:4px 0">${p.avatar?`<img src="${esc(p.avatar)}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover">`:''}<b>${p.user?'@'+esc(p.user):'Профіль'}</b></div>`:'';
const av=x=>x.has_av?`<img class=av alt="" src="/api/avatar?name=${encodeURIComponent(x.name)}">`:`<span class=av></span>`;
const prof_url=x=>x.username?`https://www.tiktok.com/@${encodeURIComponent(x.username)}`:`https://www.tiktok.com/search/user?q=${encodeURIComponent(x.name)}`;
const HEAD='<tr><th>Час<th>Контакт<th>Дія<th>Статус</tr>';
function login(){$('#app').innerHTML=`<main><h2>Вхід</h2><div class=row><input id=pw type=password placeholder="Пароль" autofocus autocomplete="current-password"><button class=b id=go>Увійти</button></div><label><input type=checkbox id=sp>Показати пароль</label></main>`;$('#sp').onchange=e=>{$('#pw').type=e.target.checked?'text':'password'};
 const go=async()=>{await api('login','POST',{password:$('#pw').value});shell()};$('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key=='Enter')go()}}
function shell(){clearInterval(timer);const t={home:'Головна',contacts:'Контакти',auto:'Автоматизація',hist:'Історія',set:'Налаштування'};
 $('#app').innerHTML=`<nav>${Object.entries(t).map(([k,v])=>`<button data-t=${k} class="${k==tab?'on':''}">${v}</button>`).join('')}</nav><main id=m></main>`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});({home,contacts,auto,hist,set})[tab]()}
async function home(){const s=await api('status');const A={ok:'Підключено',expired:'Сесія недійсна',pending:'Очікує перевірки',none:'Не підключено'};
 $('#m').innerHTML=`<h2>Головна</h2><div class=row style="align-items:center;gap:24px"><div><small>Наступна літера</small><div class=letter>${s.next_letter}</div></div>
 <button class="b ${s.running?'red':''}" id=t>${s.running?'Зупинити':'Запустити'}</button></div>
 <div class=row><button class=b id=rf>Оновити контакти з TikTok</button><button class=b id=rn>Надіслати літеру зараз</button></div>
 ${s.cmd?'<p>⏳ Команда в черзі — воркер виконає її протягом хвилини.</p>':''}
 <div class=grid><div class=card><small>Сервер (worker)</small><b>${s.worker_online?'онлайн':'не відповідає'}</b></div>
 <div class=card><small>Автоматизація</small><b>${s.running?'працює':'вимкнена'}</b></div>
 <div class=card><small>Останнє виконання</small><b>${esc(s.last_run?new Date(s.last_run).toLocaleString('uk-UA'):'—')}</b></div>
 <div class=card><small>Контактів / вибрано</small><b>${s.contacts} / ${s.selected}</b></div><div class=card><small>Надіслано літер</small><b>${s.sent}</b></div>
 <div class=card><small>Акаунт</small>${prof(s.profile)}<b>${A[s.auth]}</b></div></div>
 <h3>Що відбувається зараз</h3><div style="overflow-x:auto"><table id=feed></table></div>`;
 $('#t').onclick=async()=>{await api('running','POST',{on:!s.running});home()};
 $('#rf').onclick=async()=>{await api('refresh','POST');home()};
 $('#rn').onclick=async()=>{if(confirm('Надіслати літеру зараз усім вибраним контактам?')){await api('run_now','POST');home()}};
 const feed=async()=>{const e=$('#feed');if(e)e.innerHTML=HEAD+rows(await api('history?kind=all&limit=30'))};feed();timer=setInterval(feed,5000)}
async function contacts(q=''){const c=await api('contacts?q='+encodeURIComponent(q));
 $('#m').innerHTML=`<h2>Контакти</h2><p>Позначте галочкою, з ким вести діалоги. Літери та смайлики йдуть лише вибраним.</p>
 <div class=row><button class=b id=rf>Оновити список із TikTok</button><button class=b id=all>Вибрати всіх</button><button class=b id=none>Зняти всіх</button></div>
 <div class=row><input id=nn placeholder="Додати вручну (нік як у чаті)"><button class=b id=add>Додати</button></div>
 <input id=q placeholder="Пошук" value="${esc(q)}"><p>Вибрано: <b>${c.filter(x=>x.enabled).length}</b> із ${c.length}</p>
 <table><tr><th>Користувач<th>Діалог</tr>${c.map((x,i)=>`<tr><td>${av(x)}<a class=nick href="${prof_url(x)}" target=_blank rel="noopener noreferrer" title="${x.username?'Відкрити профіль у TikTok':'Знайти в TikTok'}">${esc(x.name)}</a><td><input type=checkbox data-i=${i} ${x.enabled?'checked':''}></tr>`).join('')||'<tr><td colspan=2>Список порожній. Натисніть «Оновити список із TikTok» і зачекайте хвилину (хід видно на Головній).'}</table>`;
 const bulk=async(e,s)=>{await api('contacts/bulk','POST',{enabled:e,streak_only:s})};
 $('#rf').onclick=async()=>{await api('refresh','POST');alert('Команду надіслано. Оновіть сторінку приблизно за хвилину.')};
 $('#all').onclick=async()=>{await bulk(true,false);contacts(q)};$('#none').onclick=async()=>{await bulk(false,false);contacts(q)};

 $('#add').onclick=async()=>{await api('contacts/add','POST',{name:$('#nn').value});contacts(q)};
 $('#q').onchange=e=>contacts(e.target.value);
 document.querySelectorAll('[data-i]').forEach(b=>b.onchange=async()=>{await api('contacts/toggle','POST',{name:c[b.dataset.i].name,enabled:b.checked});contacts(q)})}
async function auto(){const s=await api('settings');const rc=(await api('contacts')).filter(x=>x.enabled);
 $('#m').innerHTML=`<h2>Автоматизація</h2><label><input type=checkbox id=daily ${s.daily_on=='1'?'checked':''}>Щоденне надсилання літер</label>
 <div class=card style="margin:12px 0"><b>Отримувачі</b><p>Літери та смайлики надсилаються <b>лише вибраним</b> контактам. Вибрано: ${rc.length}.${rc.length?'':' Нікому нічого не буде надіслано — оберіть людей у «Контактах».'}</p><div class=row>${rc.map(x=>`<span class=chip>${av(x)}${esc(x.name)}</span>`).join('')}</div><button class=b id=chg>Змінити вибір</button></div>
 <label><input type=checkbox id=video ${s.video_on=='1'?'checked':''}>Відповідати на відео (вибраним)</label>
 <label>Смайлик <input id=emoji value="${esc(s.emoji)}" size=4></label><label>Час надсилання <input id=time type=time value="${s.send_time}"></label>
 <label>Часовий пояс <input id=tz value="${esc(s.tz)}"></label><button class=b id=save>Зберегти</button>`;
 $('#chg').onclick=()=>{tab='contacts';shell()};$('#save').onclick=async()=>{await api('settings','PUT',{daily_on:$('#daily').checked?'1':'0',video_on:$('#video').checked?'1':'0',emoji:$('#emoji').value,send_time:$('#time').value,tz:$('#tz').value});alert('Збережено')}}
async function hist(k='all'){const h=await api('history?kind='+k+'&limit=200');
 $('#m').innerHTML=`<h2>Історія</h2><div class=row><select id=k><option value=all ${k=='all'?'selected':''}>Усі дії</option><option value=letter ${k=='letter'?'selected':''}>Автоповідомлення</option><option value=video ${k=='video'?'selected':''}>Відео та відповіді</option></select></div>
 <div style="overflow-x:auto"><table>${HEAD}${rows(h)}</table></div>`;$('#k').onchange=e=>hist(e.target.value)}
async function set(){const s=await api('status');
 $('#m').innerHTML=`<h2>Налаштування</h2><p>Статус акаунта: <b>${s.auth}</b></p>${s.profile?`<div class=card style="margin-bottom:12px"><small>Підключено як</small>${prof(s.profile)}</div>`:''}<p>Вставте JSON cookies tiktok.com (див. README, розділ 4):</p><textarea id=ck></textarea>
 <div class=row><button class=b id=ck2>Перевірити підключення</button><button class=b id=sv>Підключити акаунт</button><button class="b red" id=del>Відключити акаунт</button><button class=b id=out>Вийти з панелі</button></div><h3>Діагностика</h3><p>Показує, що бачив воркер при останній невдалій спробі.</p><button class=b id=dg>Показати, що бачив воркер</button><div id=dgo></div>`;
 $('#dg').onclick=async()=>{const d=await api('debug');$('#dgo').innerHTML=d.info?`<p style="word-break:break-all">${esc(d.info.url)}<br>${esc(d.info.title)}</p><p style="word-break:break-all">data-e2e: ${esc((d.info.e2e||[]).join(', '))}</p>${d.shot?`<img src="data:image/jpeg;base64,${d.shot}" alt="" style="max-width:100%;border:1px solid var(--line)">`:''}`:'<p>Даних поки немає. Натисніть «Оновити контакти» і спробуйте ще раз.</p>'};$('#ck2').onclick=async()=>{await api('check','POST');alert('Перевірку запущено. Оновіть сторінку за хвилину.')};$('#sv').onclick=async()=>{await api('cookies','POST',{cookies:$('#ck').value});alert('Збережено (зашифровано)');set()};
 $('#del').onclick=async()=>{await api('cookies','DELETE');set()};$('#out').onclick=async()=>{await api('logout','POST');login()}}
api('me').then(r=>r.ok?shell():login());
</script></body></html>

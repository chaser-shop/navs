databases:
  - name: tt-db
    plan: basic-256mb   # free-план Render видаляється через 30 днів
envVarGroups:
  - name: tt-shared
    envVars:
      - key: SECRET_KEY
        generateValue: true
services:
  - type: web
    name: tt-web
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - fromGroup: tt-shared
      - key: DATABASE_URL
        fromDatabase: {name: tt-db, property: connectionString}
      - key: ADMIN_PASSWORD
        sync: false
  - type: worker
    name: tt-worker
    runtime: docker
    plan: standard      # Chromium потребує >512 МБ RAM
    dockerCommand: python -m app.worker
    envVars:
      - fromGroup: tt-shared
      - key: DATABASE_URL
        fromDatabase: {name: tt-db, property: connectionString}
